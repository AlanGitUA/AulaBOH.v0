spring.application.name=grades-service
server.port=8083
spring.datasource.url=jdbc:h2:mem:grades-service;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
services.students.url=http://localhost:8081
server.error.include-message=always
server.error.include-binding-errors=always
spring.jpa.open-in-view=false
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
# Observabilidad: endpoints de salud, metricas y circuit breakers
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.endpoint.health.show-details=always

# Logs de comportamiento
logging.level.root=INFO
logging.level.cl.aulaboh=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Circuit Breaker - metodos criticos de GradeService y llamada a students-service
resilience4j.circuitbreaker.instances.gradesServiceMethods.register-health-indicator=true
resilience4j.circuitbreaker.instances.gradesServiceMethods.sliding-window-size=5
resilience4j.circuitbreaker.instances.gradesServiceMethods.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.gradesServiceMethods.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.gradesServiceMethods.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.gradesServiceMethods.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.gradesServiceMethods.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.gradesServiceMethods.ignore-exceptions=cl.aulaboh.grades.exception.BusinessException

resilience4j.circuitbreaker.instances.studentsService.register-health-indicator=true
resilience4j.circuitbreaker.instances.studentsService.sliding-window-size=5
resilience4j.circuitbreaker.instances.studentsService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.studentsService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.studentsService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.studentsService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.studentsService.automatic-transition-from-open-to-half-open-enabled=true
