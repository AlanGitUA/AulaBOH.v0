spring.application.name=students-service
server.port=8081
spring.datasource.url=${STUDENTS_DB_URL:jdbc:postgresql://localhost:5432/aulaboh_students}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:aulaboh}
spring.datasource.password=${DB_PASSWORD:aulaboh}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
server.error.include-message=always
server.error.include-binding-errors=always
spring.jpa.open-in-view=false
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
# Observabilidad: endpoints de salud, metricas y circuit breakers
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.endpoint.health.show-details=always

# Logs de comportamiento
logging.level.root=INFO
logging.level.cl.aulaboh=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Circuit Breaker - metodos criticos de StudentService
resilience4j.circuitbreaker.instances.studentsServiceMethods.register-health-indicator=true
resilience4j.circuitbreaker.instances.studentsServiceMethods.sliding-window-size=5
resilience4j.circuitbreaker.instances.studentsServiceMethods.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.studentsServiceMethods.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.studentsServiceMethods.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.studentsServiceMethods.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.studentsServiceMethods.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.studentsServiceMethods.ignore-exceptions=cl.aulaboh.students.exception.StudentNotFoundException
