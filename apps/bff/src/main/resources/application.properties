spring.application.name=bff
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
services.students.url=http://localhost:8081
services.attendance.url=http://localhost:8084
services.grades.url=http://localhost:8083
server.error.include-message=always
server.error.include-binding-errors=always
# Observabilidad: endpoints de salud, metricas y circuit breakers
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.endpoint.health.show-details=always

# Logs de comportamiento
logging.level.root=INFO
logging.level.cl.aulaboh=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Circuit Breaker - BFF y clientes hacia microservicios
resilience4j.circuitbreaker.instances.bffFacade.register-health-indicator=true
resilience4j.circuitbreaker.instances.bffFacade.sliding-window-size=5
resilience4j.circuitbreaker.instances.bffFacade.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.bffFacade.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bffFacade.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.bffFacade.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.bffFacade.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.studentsService.register-health-indicator=true
resilience4j.circuitbreaker.instances.studentsService.sliding-window-size=5
resilience4j.circuitbreaker.instances.studentsService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.studentsService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.studentsService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.studentsService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.studentsService.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.attendanceService.register-health-indicator=true
resilience4j.circuitbreaker.instances.attendanceService.sliding-window-size=5
resilience4j.circuitbreaker.instances.attendanceService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.attendanceService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.attendanceService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.attendanceService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.attendanceService.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.gradesService.register-health-indicator=true
resilience4j.circuitbreaker.instances.gradesService.sliding-window-size=5
resilience4j.circuitbreaker.instances.gradesService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.gradesService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.gradesService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.gradesService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.gradesService.automatic-transition-from-open-to-half-open-enabled=true
