spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: bff
          uri: http://localhost:8080
          predicates:
            - Path=/api/bff/**
server:
  port: 8090
eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
